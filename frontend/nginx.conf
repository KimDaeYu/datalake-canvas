server {
  listen 80;
  root /usr/share/nginx/html;

  # Single-page app: unknown paths fall back to index.html.
  location / {
    try_files $uri /index.html;
  }

  # Same-origin API proxy, so the browser never needs CORS. "backend" is the compose service name.
  # Docker's DNS (127.0.0.11) plus a variable make nginx re-resolve the name instead of caching
  # the IP at startup; otherwise recreating the backend container leaves the UI with 502s.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
}
