[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datalake-canvas-backend"
version = "0.1.0"
description = "FastAPI backend for DataLake Canvas: workflow storage, executor, MCP client and agent layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "mcp>=1.10,<2",
  "openai-agents>=0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["datalake_canvas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
